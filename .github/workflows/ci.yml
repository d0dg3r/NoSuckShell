name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-frontend:
    name: Desktop frontend (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm run desktop:install

      - name: TypeScript build (tsc + vite build)
        working-directory: apps/desktop
        run: npm run build

      - name: Vitest unit tests
        working-directory: apps/desktop
        run: npm test

  desktop-rust:
    name: Desktop backend (cargo check + cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  desktop-rust-quality:
    name: Desktop backend (rustfmt + clippy, advisory)
    runs-on: ubuntu-latest
    # Advisory until the rust-error-audit cleanup lands; the job runs but does not block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets

  desktop-e2e:
    name: Desktop E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm run desktop:install

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: apps/desktop
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results (traces, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore
